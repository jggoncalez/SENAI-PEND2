<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de Sensores</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">

    <h1>Dashboard de Sensores</h1>
    <button type="button" class="status-conexao" id="statusConexao" aria-pressed="true">
      <span class="status-dot"></span>
      <span id="statusTexto">Online</span>
    </button>
  </header>

  <main class="main">
    <section class="filtros">
      <button id="btnAtualizar">Atualizar dados</button>
      <select id="filtroTipo">
        <option value="Todos">Todos</option>
        <option value="Temperatura">Temperatura</option>
        <option value="Umidade">Umidade</option>
        <option value="Pressão">Pressão</option>
      </select>
    </section>

    <section class="grid-sensores" id="gridSensores">
      <!-- Cards dos sensores renderizados via JS -->
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Dashboard de Sensores. Todos os direitos reservados.</p>
    <p>Última atualização: <span id="ultimaAtualizacao">--:--:--</span></p>
  </footer>

  <div class="modal-overlay" id="modalHistorico" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
      <div class="modal-header">
        <h2 id="modalTitulo">Histórico</h2>
        <button type="button" id="btnFecharModal" aria-label="Fechar">&times;</button>
      </div>
      <ol class="modal-lista" id="modalLista"></ol>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
